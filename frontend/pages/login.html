<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Enterprise Auth Framework</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      🛡️ <span>Enterprise Auth</span>
    </a>
    <div id="nav-right"></div>
  </nav>

  <main class="container">
    <div class="auth-container glass-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your enterprise account to continue</p>
      </div>

      <!-- Social OAuth Buttons -->
      <div class="social-btns">
        <a href="/api/v1/auth/google" class="btn btn-social" style="text-decoration:none;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </a>
        <a href="/api/v1/auth/github" class="btn btn-social" style="text-decoration:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
      </div>

      <div class="oauth-divider">
        <span>OR CONTINUE WITH EMAIL</span>
      </div>

      <!-- Local Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="admin@enterprise.local" required>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <label for="password" style="margin-bottom:0;">Password</label>
            <a href="/pages/forgot-password.html" style="font-size:0.85rem; color:var(--accent-primary); text-decoration:none;">Forgot Password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-secondary);">
        Don't have an account? <a href="/pages/register.html" style="color:var(--accent-primary); text-decoration:none; font-weight:600;">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- 2FA TOTP Modal Step -->
  <div id="mfa-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin-bottom:0.5rem;">Two-Factor Authentication</h2>
      <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:1.5rem;">
        Enter the 6-digit verification code from your authenticator app (or backup recovery code).
      </p>

      <form id="mfa-form">
        <div class="form-group">
          <label for="mfaToken">Security Code</label>
          <input type="text" id="mfaToken" class="form-control" placeholder="123456" maxlength="12" required style="font-size:1.25rem; text-align:center; letter-spacing:0.2em;">
        </div>
        <div style="display:flex; gap:1rem; margin-top:1.5rem;">
          <button type="button" onclick="UI.closeModal('mfa-modal')" class="btn btn-secondary" style="flex:1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1;">Verify & Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.requireGuest();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'OAuthFailed') {
        UI.showToast('Social OAuth authentication failed or was cancelled.', 'danger');
      }

      const loginForm = document.getElementById('login-form');
      const mfaForm = document.getElementById('mfa-form');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const res = await API.request('/auth/login', {
            method: 'POST',
            body: { email, password }
          });

          if (res.success) {
            if (res.data.mfaRequired) {
              UI.openModal('mfa-modal');
            } else {
              UI.showToast('Login successful! Redirecting...', 'success');
              setTimeout(() => {
                window.location.href = '/pages/dashboard.html';
              }, 1000);
            }
          }
        } catch (error) {
          UI.showToast(error.message, 'danger');
        }
      });

      mfaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const mfaToken = document.getElementById('mfaToken').value.trim();

        try {
          const res = await API.request('/auth/login', {
            method: 'POST',
            body: { email, password, mfaToken }
          });

          if (res.success && !res.data.mfaRequired) {
            UI.showToast('2FA Verified! Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = '/pages/dashboard.html';
            }, 1000);
          }
        } catch (error) {
          UI.showToast(error.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
