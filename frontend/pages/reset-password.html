<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Enterprise Auth</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">🛡️ <span>Enterprise Auth</span></a>
    <div id="nav-right"></div>
  </nav>

  <main class="container">
    <div class="auth-container glass-card">
      <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Set a new secure password for your account</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Reset Password</button>
      </form>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.requireGuest();
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        UI.showToast('Invalid or missing password reset token.', 'danger');
        setTimeout(() => window.location.href = '/pages/forgot-password.html', 2000);
      }

      const form = document.getElementById('reset-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          return UI.showToast('Passwords do not match.', 'danger');
        }

        try {
          const res = await API.request('/auth/reset-password', {
            method: 'POST',
            body: { token, password }
          });
          UI.showToast(res.data.message, 'success');
          setTimeout(() => window.location.href = '/pages/login.html', 2500);
        } catch (err) {
          UI.showToast(err.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
