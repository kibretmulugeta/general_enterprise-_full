<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Enterprise Auth</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">🛡️ <span>Enterprise Auth</span></a>
    <div id="nav-right"></div>
  </nav>

  <main class="container">
    <div class="auth-container glass-card">
      <div class="auth-header">
        <h1>Forgot Password</h1>
        <p>Enter your registered email address to receive password reset instructions.</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@enterprise.local" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Send Reset Link</button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-secondary);">
        Remember your password? <a href="/pages/login.html" style="color:var(--accent-primary); text-decoration:none;">Sign In</a>
      </p>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.requireGuest();
      const form = document.getElementById('forgot-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        try {
          const res = await API.request('/auth/forgot-password', {
            method: 'POST',
            body: { email }
          });
          UI.showToast(res.data.message, 'success');
        } catch (err) {
          UI.showToast(err.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
